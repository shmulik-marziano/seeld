# supabase/config.toml for seeld-site (Frankfurt, qxhpolktdfgcbxtfxgov). Reviewed values, FOUNDATION v2.2 /
# IMPLEMENTATION-PLAN item 19. The Tokyo file is archived at supabase/_archive_tokyo/config.tokyo.toml.
#
# Who reads this file:
#  - `supabase start` / `supabase db reset` (local stack and CI). Changes need `supabase stop && supabase start`.
#  - Supabase preview branches (GitHub branching integration), if the owner enables it.
#  - NOT production: hosted Auth/API settings are set in the dashboard, which is the source of truth
#    (set by the coordinator on 2026-11-18). Keep the values below identical to the dashboard;
#    scripts/ci/check-supabase-config.mjs fails CI when a reviewed value drifts in this file.
#
# Secrets: only env(...) references, never values. Locally they come from supabase/.env (gitignored);
# in CI the database job sets harmless test values in the job env (Cloudflare's always-pass Turnstile
# test secret and a dummy SMTP password). See .github/workflows/ci.yml.
#
# Social login is never enabled: there is deliberately no [auth.external.*] section.
project_id = "seeld-site"

[api]
enabled = true
port = 54321
# Only api (public site) and staff (agent app) are exposed. public / graphql_public are not.
# staff is created by migration 20261119090300; this file ships in the same PR as that migration.
schemas = ["api", "staff"]
extra_search_path = ["extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://seeld.co.il"
additional_redirect_urls = ["https://seeld.co.il/**", "https://www.seeld.co.il/**"]
# Invite-only: users are created by staff-invite through the before_user_created hook.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# The dashboard is the source of truth for the password policy (set 2026-11-18, together with leaked-password
# protection, which has no config.toml key). Keep these two lines identical to the dashboard.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.sessions]
timebox = "12h"
inactivity_timeout = "1h"

[auth.rate_limit]
email_sent = 10                # per hour (custom SMTP)
sign_in_sign_ups = 20          # per 5 minutes per IP
token_refresh = 150            # per 5 minutes per IP
token_verifications = 20       # per 5 minutes per IP
sms_sent = 0                   # no SMS
anonymous_users = 0            # no anonymous sign-ins

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"

[auth.email]
# DELIBERATE DEVIATION from IMPLEMENTATION-PLAN item 19 (which says false), verified with CLI 2.122.1 on
# 2026-11-18: in config.toml this key is the Email PROVIDER switch (GOTRUE_EXTERNAL_EMAIL_ENABLED), not a
# signup switch. false = "Email logins are disabled" for everyone, staff included. Signups stay off through
# [auth] enable_signup = false (GOTRUE_DISABLE_SIGNUP=true): a signup with a valid CAPTCHA token returns
# 422 signup_disabled. Dashboard equivalent: Email provider ON, "Allow new users to sign up" OFF.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 600               # 10 minutes; also the lifetime of invite and recovery links

[auth.email.smtp]
# Locally this sends real mail through Resend only when supabase/.env holds the real password; with the CI
# dummy password every send fails, which is fine because no CI step sends mail.
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASSWORD)"
admin_email = "no-reply@seeld.co.il"
sender_name = "SEELD"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 2

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Accepts only open staff invitations (migrations 20261119090600 + 20261119091400).
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/hook_before_user_created"

# Edge functions: flags are code, reviewed in PRs. The folder list must stay a subset of the CI allowlist.
[functions.lead-intake]        # public form intake; checks Origin + Turnstile itself
verify_jwt = false
[functions.notify-worker]      # pg_cron via ops.http_invoke with the cron secret
verify_jwt = false
[functions.chat-bot]           # public chat; Origin allowlist, per-ip limits and the ops.config gate in the function (no Turnstile)
verify_jwt = false
[functions.fetch-cma-data]     # pg_cron via ops.http_invoke with the cron secret
verify_jwt = false
[functions.health]             # public health probe (3 keys, no data)
verify_jwt = false
[functions.staff-invite]       # admin only; fresh session + TOTP checked in the function
verify_jwt = true
[functions.surense-webhook]    # Surense via Svix; signature + ops.config switch checked in the function
verify_jwt = false
[functions.surense-worker]     # surense queue; x-cron-secret (manual now, pg_cron after owner approval)
verify_jwt = false
[functions.surense-sync]       # admin only; fresh session + TOTP checked in the DB (staff.admin_assert_fresh)
verify_jwt = true
[functions.surense-health]     # staff probe of the Surense credentials (read only, no token returned); deployed v1
verify_jwt = true
[functions.sms-health]         # Micropay token probe (balance only, nothing sent); x-cron-secret like the workers
verify_jwt = false
[functions.poa-intake]         # public POA wizard backend; Origin + Turnstile + session token + ops.config switches (poa_*) in the function and DB
verify_jwt = false
[functions.client-docs]        # staff download of stored client documents; JWT + staff aal2/fresh MFA checked in the DB (staff.client_doc_get)
verify_jwt = true
[functions.forms-intake]       # public client forms backend (/forms); Origin + Turnstile + session token + ops.config switches (forms_*) in the function and DB
verify_jwt = false
# Platform scaffolds kept until the owner decides (park them, or keep and fix). Never public.
[functions.api-v1]
verify_jwt = true
[functions.queue-worker]
verify_jwt = true
